name: 自動更新智財資料

on:
  schedule:
    - cron: '0 0-9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install openpyxl google-auth requests

      - name: 從私人 Google Sheets 讀取並產生網頁
        run: python scripts/build.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: 提交更新後的網頁
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes."
          else
            DATETIME=$(TZ='Asia/Taipei' date '+%Y-%m-%d %H:%M 台灣時間')
            git commit -m "自動更新資料：$DATETIME"
            git push
          fi
